name: CI

on:
  push:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize]
jobs:
  quality:
    name: Quality, Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2️⃣ Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: bun install

      # 4️⃣ Setup Turbo cache
      - name: Setup Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # 5️⃣ Setup Biome
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      # 6️⃣ Run Biome CI
      - name: Run Biome checks
        run: bun run check:ci

      # 7️⃣ Check types
      - name: Check TypeScript types
        run: bun run check-types

      # 8️⃣ Clean dist
      - name: Clean dist folder
        run: bun run clean

      # 9️⃣ Build TypeScript & bundle
      - name: Build library
        run: bun run build

      # 🔟 Run tests
      - name: Run tests
        run: bun test
